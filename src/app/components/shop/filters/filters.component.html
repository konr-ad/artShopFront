<div class="w-full flex flex-col items-center gap-4">
  <!-- Pasek triggerów -->
  <div class="flex flex-wrap items-center gap-4">
    <!-- Painting Type -->
    <div class="relative">
      <button type="button"
              (click)="togglePaintingTypeDropdown(); $event.stopPropagation()"
              class="inline-flex items-center gap-2 rounded-full bg-white/80 backdrop-blur px-4 py-2
                     text-sm font-medium text-gray-800 ring-1 ring-black/10 shadow-sm hover:shadow
                     transition">
        <span>{{ 'nav.shop.paintingType' | translate }}</span>
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-3 w-3 transition-transform duration-500 ease-out"
             [class.rotate-180]="paintingTypeDropdownOpen"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
        </svg>
      </button>

      <!-- Dropdown -->
      <div class="z-50 absolute left-0 mt-2 w-80 rounded-2xl bg-white/90 backdrop-blur shadow-xl ring-1 ring-black/5 p-4"
           [ngClass]="{ 'hidden': !paintingTypeDropdownOpen, 'block': paintingTypeDropdownOpen }"
           (mouseenter)="onDropdownEnter()"
           (mouseleave)="onDropdownLeave()"
           (click)="$event.stopPropagation()">
        <div class="mb-3 text-xs uppercase tracking-wide text-gray-500">
          {{ 'nav.shop.paintingType' | translate }}
        </div>

        <ul class="grid gap-2">
          <li>
            <label for="oil" class="flex items-center gap-3 cursor-pointer">
              <input id="oil" type="checkbox"
                     class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
                     [checked]="isChecked('paintings','OIL')"
                     (change)="onFilterChange('paintings',$event)"
                     value="OIL" />
              <span class="text-sm text-gray-800">{{ 'nav.shop.menu.oils' | translate }}</span>
            </label>
          </li>
          <li>
            <label for="monotype" class="flex items-center gap-3 cursor-pointer">
              <input id="monotype" type="checkbox"
                     class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
                     [checked]="isChecked('paintings','MONOTYPE')"
                     (change)="onFilterChange('paintings',$event)"
                     value="MONOTYPE" />
              <span class="text-sm text-gray-800">{{ 'nav.shop.menu.monotypes' | translate }}</span>
            </label>
          </li>
          <li>
            <label for="print" class="flex items-center gap-3 cursor-pointer">
              <input id="print" type="checkbox"
                     class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
                     [checked]="isChecked('paintings','PRINT')"
                     (change)="onFilterChange('paintings',$event)"
                     value="PRINT" />
              <span class="text-sm text-gray-800">{{ 'nav.shop.menu.prints' | translate }}</span>
            </label>
          </li>
        </ul>
      </div>
    </div>

    <!-- Price -->
    <div class="relative">
      <button type="button"
              (click)="togglePriceDropdown(); $event.stopPropagation()"
              class="inline-flex items-center gap-2 rounded-full bg-white/80 backdrop-blur px-4 py-2
                     text-sm font-medium text-gray-800 ring-1 ring-black/10 shadow-sm hover:shadow
                     transition">
        <span>{{ 'nav.shop.price' | translate }}</span>
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-3 w-3 transition-transform duration-500 ease-out"
             [class.rotate-180]="priceDropdownOpen"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
        </svg>
      </button>

      <!-- Dropdown -->
      <div class="z-50 absolute left-0 mt-2 w-80 rounded-2xl bg-white/90 backdrop-blur shadow-xl ring-1 ring-black/5 p-4"
           [ngClass]="{ 'hidden': !priceDropdownOpen, 'block': priceDropdownOpen }"
           (mouseenter)="onDropdownEnter()"
           (mouseleave)="onDropdownLeave()"
           (click)="$event.stopPropagation()">
        <div class="mb-3 text-xs uppercase tracking-wide text-gray-500">
          {{ 'nav.shop.price' | translate }}
        </div>

        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 rounded-lg ring-1 ring-black/10 bg-white px-3 py-2">
            <span class="text-xs text-gray-500">PLN</span>
            <input type="number" inputmode="decimal" min="0" placeholder="Min"
                   class="w-full border-0 bg-transparent outline-none text-sm"
                   [(ngModel)]="filters.priceFrom"
                   (input)="onInputChange('priceFrom',$event)" />
          </label>

          <label class="flex items-center gap-2 rounded-lg ring-1 ring-black/10 bg-white px-3 py-2">
            <span class="text-xs text-gray-500">PLN</span>
            <input type="number" inputmode="decimal" min="0" placeholder="Max"
                   class="w-full border-0 bg-transparent outline-none text-sm"
                   [(ngModel)]="filters.priceTo"
                   (input)="onInputChange('priceTo',$event)" />
          </label>
        </div>

      </div>
    </div>
  </div>

  <!-- Wybrane filtry jako chipsy -->
  <div class="flex flex-wrap items-center gap-2"
       *ngIf="(filters.paintings?.length || filters.priceFrom || filters.priceTo)">
    <!-- typy -->
    <ng-container *ngFor="let t of filters.paintings">
      <button type="button"
              class="inline-flex items-center gap-2 rounded-full bg-indigo-50 text-indigo-700
                     px-3 py-1 text-xs ring-1 ring-indigo-200"
              (click)="onFilterChange('paintings', { target: { checked: false, value: t }})">
        {{ t }}
        <svg class="h-3 w-3" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </ng-container>

    <!-- cena -->
    <button *ngIf="filters.priceFrom || filters.priceTo" type="button"
            class="inline-flex items-center gap-2 rounded-full bg-gray-100 text-gray-700
                   px-3 py-1 text-xs ring-1 ring-black/10"
            (click)="filters.priceFrom=null; filters.priceTo=null; applyFilters()">
      PLN {{ filters.priceFrom || '—' }}–{{ filters.priceTo || '—' }}
      <svg class="h-3 w-3" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
