<div class="bg-white" *ngIf="painting">
  <div class="mx-auto max-w-2xl px-4 py-16 sm:px-6 sm:py-24 lg:max-w-7xl lg:px-8">
    <div class="lg:grid lg:grid-cols-2 lg:items-start lg:gap-x-8">
      <!-- Galeria -->
      <div class="flex flex-col-reverse">
        <!-- Miniatury -->
        <div class="mx-auto mt-6 hidden w-full max-w-2xl sm:block lg:max-w-none" *ngIf="mediaUrls.length > 1">
          <div class="grid grid-cols-4 gap-6" role="tablist">
            <button *ngFor="let url of mediaUrls; index as i"
                    type="button"
                    (click)="select(i)"
                    class="relative flex h-24 cursor-pointer items-center justify-center rounded-md bg-white text-sm font-medium uppercase text-gray-900 hover:bg-gray-50 focus:outline-none focus:ring focus:ring-opacity-50 focus:ring-offset-4">
              <span class="sr-only">Image {{ i + 1 }}</span>
              <span class="absolute inset-0 overflow-hidden rounded-md">
                <img [src]="url" alt="" class="h-full w-full object-cover object-center" />
              </span>
              <span class="pointer-events-none absolute inset-0 rounded-md ring-2"
                    [class.ring-indigo-500]="i === selectedIndex"
                    [class.ring-transparent]="i !== selectedIndex"
                    aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <!-- Obraz główny -->
        <div class="aspect-h-1 aspect-w-1 w-full">
          <img [src]="mediaUrls[selectedIndex] || painting.imageUrl"
               class="h-full w-full object-cover object-center sm:rounded-lg"
               alt="{{ painting.name }}" />
        </div>
      </div>

      <!-- Info o produkcie -->
      <div class="mt-10 px-4 sm:mt-16 sm:px-0 lg:mt-0">
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">{{ painting.name }}</h1>

        <div class="mt-3">
          <p class="text-3xl tracking-tight text-gray-900">{{ painting.price | currency:'PLN':'symbol':'1.0-2' }}</p>
        </div>

        <div class="mt-6">
          <div class="space-y-6 text-base text-gray-700">
            <p>{{ painting.description }}</p>
          </div>
        </div>

        <div class="mt-10 flex">
          <button type="button"
                  class="flex max-w-xs flex-1 items-center justify-center rounded-md border border-transparent bg-gray-600 px-8 py-3 text-base font-medium text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-50 sm:w-full"
                  (click)="addToCart()"
                  [disabled]="isButtonDisabled">
            {{ buttonText }}
          </button>
        </div>

        <!-- sekcja dodatkowa (opcjonalnie zostawiam) -->
        <section aria-labelledby="details-heading" class="mt-12">
          <h2 id="details-heading" class="sr-only">Additional details</h2>
          <div class="divide-y divide-gray-200 border-t">
            <div>
              <h3>
                <button type="button"
                        class="group relative flex w-full items-center justify-between py-6 text-left"
                        (click)="toggleList()"
                        [attr.aria-expanded]="isExpanded">
                  <span class="text-sm font-medium text-gray-900">Features</span>
                  <span class="ml-6 flex items-center">
                    <svg *ngIf="!isExpanded" class="block h-6 w-6 text-gray-400 group-hover:text-gray-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    <svg *ngIf="isExpanded" class="block h-6 w-6 text-indigo-400 group-hover:text-indigo-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15"/></svg>
                  </span>
                </button>
              </h3>

              <div [ngClass]="{ 'max-h-0': !isExpanded, 'max-h-[100rem]': isExpanded }"
                   class="transition-all duration-500 ease-in-out overflow-hidden max-h-0">
                <ul class="p-0 m-0">
                  <li>Multiple strap configurations</li>
                  <li>Spacious interior with top zip</li>
                  <li>Water-resistant</li>
                </ul>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
