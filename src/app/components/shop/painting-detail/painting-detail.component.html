<div class="bg-white">
  <div class="mx-auto max-w-7xl px-4 pb-24 pt-10 sm:px-6 lg:px-8">
    <div class="lg:grid lg:grid-cols-12 lg:gap-x-10">

      <!-- LEFT: Gallery -->
      <div class="lg:col-span-7">
        <div class="relative group">
          <div
            class="rounded-2xl overflow-hidden shadow-[0_10px_35px_rgba(0,0,0,0.15)] ring-1 ring-black/5 bg-white"
            #imgWrap
          >
            <img
              #mainImg
              [src]="selectedImgUrl || 'assets/no-image.svg'"
              [alt]="details?.name || 'Artwork'"
              class="w-full max-h-[500px] bg-white block select-none cursor-zoom-in"
              [ngClass]="fillMode"
              (load)="onMainImgLoad($event)"
              (click)="openLightbox()"
              draggable="false"
            />
          </div>

          <div class="mt-4 flex gap-3 overflow-x-auto pb-1">
            <button
              *ngFor="let u of thumbUrls; index as i; trackBy: trackByIndex"
              type="button"
              (click)="selectThumb(i)"
              class="relative shrink-0 rounded-lg ring-2 transition focus:outline-none"
              [ngClass]="{
                'ring-indigo-500': i === selectedIndex,
                'ring-transparent hover:ring-black/10': i !== selectedIndex
              }"
              aria-label="Preview image"
            >
              <img [src]="u" [alt]="details?.name" class="h-20 w-28 object-contain rounded-md" />
            </button>
          </div>
        </div>
      </div>

      <!-- RIGHT: Info -->
      <div class="mt-10 lg:mt-0 lg:col-span-5">
        <div class="inline-flex items-center gap-2">
          <span class="inline-block h-2 w-2 rounded-full bg-indigo-400"></span>
          <span class="uppercase tracking-wider text-xs text-gray-500">{{ ('painting.types.' + (details?.type | lowercase)) | translate }}</span>
        </div>

        <h1 class="mt-2 text-4xl font-extrabold tracking-tight text-gray-900">
          {{ details?.name }}
        </h1>

        <p class="mt-4 text-3xl font-semibold text-gray-900">
          {{ details?.price | currency:'PLN':'symbol':'1.0-2' }}
        </p>

        <div class="mt-6 prose prose-indigo max-w-none text-gray-700">
          <p *ngIf="description; else noDesc">{{ description }}</p>
          <ng-template #noDesc>
            <p class="italic text-gray-500">Opis wkrótce…</p>
          </ng-template>
        </div>

        <div class="mt-8 flex gap-3">
          <button
            type="button"
            (click)="addToCart()"
            [disabled]="isButtonDisabled"
            class="inline-flex items-center justify-center rounded-xl bg-gray-800 px-6 py-3 text-white shadow-lg
         hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50"
            aria-live="polite"
          >
            {{ (added ? 'paintingDetail.added' : 'paintingDetail.addToCart') | translate }}
          </button>
        </div>

    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div
  *ngIf="lightboxOpen"
  class="fixed inset-0 z-50 bg-black/80 grid place-items-center p-4"
  (click)="closeLightbox()"
  role="dialog" aria-modal="true"
>
  <div
    class="relative grid place-items-center"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      (click)="closeLightbox()"
      class="absolute top-2 right-2 rounded-full bg-white/90 text-black px-3 py-1 text-sm shadow ring-1 ring-black/10 hover:bg-white"
      aria-label="Zamknij podgląd"
    >✕</button>

    <button
      type="button"
      (click)="prevImage(); $event.stopPropagation()"
      class="absolute left-2 top-1/2 -translate-y-1/2 rounded-full bg-white/90 text-black px-3 py-1 text-sm shadow ring-1 ring-black/10 hover:bg-white"
      aria-label="Poprzedni"
    >‹</button>

    <button
      type="button"
      (click)="nextImage(); $event.stopPropagation()"
      class="absolute right-2 top-1/2 -translate-y-1/2 rounded-full bg-white/90 text-black px-3 py-1 text-sm shadow ring-1 ring-black/10 hover:bg-white"
      aria-label="Następny"
    >›</button>

    <img
      [src]="thumbUrls[selectedIndex] || selectedImgUrl || 'assets/no-image.svg'"
      [alt]="details?.name || 'Artwork'"
      class="object-contain select-none"
      draggable="false"
    />
  </div>
</div>
