<footer class="z-0 relative mt-16 overflow-hidden text-slate-700
                bg-gradient-to-br from-white via-indigo-50 to-rose-50
                ring-1 ring-slate-900/5">

  <!-- dekoracyjne „plamy” / pastelowe bloby -->
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute -top-24 -right-16 h-64 w-64 rounded-full bg-indigo-300/25 blur-3xl"></div>
    <div class="absolute -bottom-28 -left-10 h-72 w-72 rounded-full bg-rose-300/25 blur-3xl"></div>
    <div class="absolute left-1/2 top-1/3 -translate-x-1/2 h-40 w-40 rounded-full bg-emerald-300/20 blur-3xl"></div>
    <!-- subtelna faktura -->
    <div class="absolute inset-0 opacity-40
                [mask-image:radial-gradient(1000px_500px_at_50%_120%,black,transparent)]
                bg-[radial-gradient(ellipse_at_top,rgba(2,6,23,.08),transparent_60%)]"></div>
  </div>

  <div class="relative mx-auto max-w-7xl px-6 py-12">
    <!-- górny pasek: logo / nawigacja / social -->
    <div class="grid grid-cols-1 gap-8 sm:grid-cols-3 items-center">
      <!-- brand -->
      <div class="flex sm:block justify-center text-center sm:text-left">
        <div>
          <h3 class="mt-3 text-xl font-semibold tracking-tight text-slate-900">Kamila Białkowska-Ismaił</h3>
          <p class="mt-1 text-sm text-slate-600">{{ 'footer.3' | translate }}</p>
        </div>
      </div>

      <!-- nawigacja -->
      <nav class="flex flex-col items-center gap-3 text-sm sm:flex-row sm:justify-center sm:gap-6">
        <a [routerLink]="['/terms']"
           class="text-slate-600 hover:text-slate-900 transition underline-offset-4 hover:underline rounded-lg px-2 py-1">
          {{ 'footer.terms' | translate }}
        </a>
      </nav>

      <!-- social -->
      <div class="flex sm:justify-end justify-center gap-3">
        <a href="https://www.instagram.com/kamila_bialkowskaismail/" target="_blank" rel="noopener"
           class="group inline-flex items-center justify-center h-10 w-10 rounded-full
                  bg-white/60 ring-1 ring-slate-900/10 hover:bg-white hover:shadow-sm transition backdrop-blur"
           aria-label="Instagram">
          <svg viewBox="0 0 24 24" class="h-5 w-5 text-slate-600 group-hover:text-slate-900" fill="currentColor">
            <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm-5 4.5A5.5 5.5 0 1 1 6.5 14 5.5 5.5 0 0 1 12 8.5zm0 2A3.5 3.5 0 1 0 15.5 14 3.5 3.5 0 0 0 12 10.5zM17.25 6a1.25 1.25 0 1 1-1.25 1.25A1.25 1.25 0 0 1 17.25 6z"/>
          </svg>
        </a>
        <a href="mailto:dsk.bis&#64;wp.pl"
           class="group inline-flex items-center justify-center h-10 w-10 rounded-full
                  bg-white/60 ring-1 ring-slate-900/10 hover:bg-white hover:shadow-sm transition backdrop-blur"
           aria-label="Email">
          <svg viewBox="0 0 24 24" class="h-5 w-5 text-slate-600 group-hover:text-slate-900" fill="currentColor">
            <path d="M2 7a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3zm3-.5 7 4.5 7-4.5V7H5z"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- cienka linia -->
    <div class="my-8 h-px w-full bg-gradient-to-r from-transparent via-slate-900/10 to-transparent"></div>

    <!-- dolny pasek -->
    <div class="flex flex-col-reverse items-center gap-3 sm:flex-row sm:justify-between">
      <p class="text-xs text-slate-500">
        &copy; 2026 Kamila Białkowska-Ismaił · {{ 'footer.rights' | translate }}
      </p>
    </div>
  </div>
</footer>
