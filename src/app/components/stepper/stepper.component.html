<div class="w-full px-4 py-6">
  <div class="relative mx-auto max-w-3xl">
    <!-- track -->
    <div class="absolute inset-x-0 top-5 h-1.5 rounded-full bg-gray-200"></div>

    <!-- progress -->
    <div
      class="absolute top-5 h-1.5 rounded-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 transition-all duration-500"
      [ngStyle]="{
        width: activeStep==='cart' ? '0%' : (activeStep==='checkout' ? '50%' : '100%')
      }"
    ></div>

    <ol class="relative grid grid-cols-3 text-sm font-medium text-gray-600">
      <!-- Cart -->
      <li class="flex flex-col items-start">
        <div
          class="relative z-10 flex h-10 w-10 items-center justify-center rounded-full border-2 transition-all duration-300
           shadow-sm ring-1 ring-black/5"
          [ngClass]="{
      'border-indigo-600 bg-indigo-600 text-white': ['cart','checkout','payment'].includes(activeStep),
      'border-gray-300 bg-white text-gray-700': !['cart','checkout','payment'].includes(activeStep)
    }"
          [attr.aria-current]="activeStep==='cart' ? 'step' : null"
        >
          <ng-container *ngIf="activeStep==='cart'; else cartDone">1</ng-container>
          <ng-template #cartDone>
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.536-9.95a.75.75 0 00-1.06-1.06L9 10.414 7.586 9a.75.75 0 10-1.06 1.06l2 2a.75.75 0 001.06 0l3.95-3.95z"
                    clip-rule="evenodd"/>
            </svg>
          </ng-template>
        </div>
        <span class="mt-3 hidden sm:block"
              [ngClass]="{ 'text-gray-900 font-semibold': ['cart','checkout','payment'].includes(activeStep) }">
    {{ 'stepper.cart' | translate }}
  </span>
        <span class="mt-2 sm:hidden text-xs"
              [ngClass]="{ 'text-gray-900 font-semibold': ['cart','checkout','payment'].includes(activeStep) }">
    {{ 'stepper.cart' | translate }}
  </span>
      </li>

      <!-- Checkout -->
      <li class="flex flex-col items-center">
        <div
          class="relative z-10 flex h-10 w-10 items-center justify-center rounded-full border-2 transition-all duration-300
                 shadow-sm ring-1 ring-black/5"
          [ngClass]="{
            'border-indigo-600 bg-indigo-600 text-white': activeStep!=='cart',
            'border-gray-300 bg-white text-gray-700': activeStep==='cart'
          }"
          [attr.aria-current]="activeStep==='checkout' ? 'step' : null"
        >
          <ng-container *ngIf="activeStep==='checkout'; else checkoutDoneOrIdle">2</ng-container>
          <ng-template #checkoutDoneOrIdle>
            <ng-container *ngIf="activeStep==='payment'; else checkoutIdle">
              <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.536-9.95a.75.75 0 00-1.06-1.06L9 10.414 7.586 9a.75.75 0 10-1.06 1.06l2 2a.75.75 0 001.06 0l3.95-3.95z"
                      clip-rule="evenodd"/>
              </svg>
            </ng-container>
            <ng-template #checkoutIdle>2</ng-template>
          </ng-template>
        </div>
        <span class="mt-3 hidden sm:block"
              [ngClass]="{ 'text-gray-900 font-semibold': activeStep!=='cart' }">
          {{ 'stepper.checkout' | translate }}
        </span>
        <span class="mt-2 sm:hidden text-xs"
              [ngClass]="{ 'text-gray-900 font-semibold': activeStep!=='cart' }">
          {{ 'stepper.checkout' | translate }}
        </span>
      </li>

      <!-- Payment -->
      <li class="flex flex-col items-end">
        <div
          class="relative z-10 flex h-10 w-10 items-center justify-center rounded-full border-2 transition-all duration-300
                 shadow-sm ring-1 ring-black/5"
          [ngClass]="{
            'border-indigo-600 bg-indigo-600 text-white': activeStep==='payment',
            'border-gray-300 bg-white text-gray-700': activeStep!=='payment'
          }"
          [attr.aria-current]="activeStep==='payment' ? 'step' : null"
        >
          3
        </div>
        <span class="mt-3 hidden sm:block"
              [ngClass]="{ 'text-gray-900 font-semibold': activeStep==='payment' }">
          {{ 'stepper.payment' | translate }}
        </span>
        <span class="mt-2 sm:hidden text-xs"
              [ngClass]="{ 'text-gray-900 font-semibold': activeStep==='payment' }">
          {{ 'stepper.payment' | translate }}
        </span>
      </li>
    </ol>
  </div>
</div>
