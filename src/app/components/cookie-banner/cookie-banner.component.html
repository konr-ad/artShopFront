<div
  *ngIf="isVisible"
  class="fixed bottom-0 left-0 w-full z-50
         bg-gray-900 text-gray-100
         px-6 py-4
         flex flex-col md:flex-row
         items-start md:items-center
         justify-between gap-4
         shadow-lg
         animate-slide-up"
>
  <p class="text-sm leading-relaxed max-w-4xl">
    {{ 'cookies.text' | translate }}
    <a
      [routerLink]="['/privacy']"
      class="underline text-blue-400 hover:text-blue-300 ml-1"
    >
      {{ 'cookies.privacyPolicy' | translate }}
    </a>.
  </p>

  <button
    (click)="acceptCookies()"
    class="bg-blue-500 hover:bg-blue-600
           text-white text-sm font-medium
           px-5 py-2 rounded
           transition-colors whitespace-nowrap"
  >
    {{ 'cookies.accept' | translate }}
  </button>
</div>
