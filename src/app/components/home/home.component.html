<div class="container mx-auto p-4">
  <div class="flex items-center justify-between mb-4">
    <div class="text-sm text-gray-500">Strona {{ pageIndex + 1 }} z {{ totalPages }}</div>
    <div class="space-x-2">
      <button class="px-3 py-1 border rounded" (click)="prevPage()" [disabled]="pageIndex===0">←</button>
      <button class="px-3 py-1 border rounded" (click)="nextPage()" [disabled]="pageIndex+1>=totalPages">→</button>
    </div>
  </div>

  <div *ngIf="loading" class="text-sm text-gray-500">Ładowanie…</div>
  <div *ngIf="error" class="text-sm text-red-600">{{ error }}</div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="card shadow-sm" *ngFor="let painting of paintings">
      <img class="w-full" [src]="painting.imageUrl" alt="{{ painting.name }}" />
      <div class="flex flex-col p-4">
        <p class="text-lg font-semibold">{{ painting.name }}</p>
        <div class="mt-1 flex justify-between items-center">
          <small class="text-muted">{{ painting.price | currency: 'USD':'symbol' }}</small>
        </div>
      </div>
    </div>
  </div>
</div>
