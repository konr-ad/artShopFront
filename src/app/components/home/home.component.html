  <!-- states -->
  <div *ngIf="error" class="mb-4 rounded-xl bg-red-50 p-3 text-sm text-red-700 ring-1 ring-red-200">
    {{ error }}
  </div>

  <div *ngIf="loading" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let _ of [0,1,2,3,4,5]" class="aspect-[4/5] animate-pulse rounded-2xl bg-gray-200"></div>
  </div>

  <!-- grid -->
  <div *ngIf="!loading" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    <article
      *ngFor="let painting of paintings"
      (click)="painting.id && viewPainting(painting.id)"
      class="group relative cursor-pointer overflow-hidden rounded-2xl bg-white shadow ring-1 ring-black/5 transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl"
    >
      <figure class="relative aspect-[4/5]">
        <img
          [src]="painting.imageUrl || 'assets/placeholder.png'"
          [alt]="painting.name"
          loading="lazy"
          class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"
        />

        <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/60 via-black/0"></div>

        <!-- type chip -->
        <div class="absolute left-3 top-3">
          <span
            class="rounded-full bg-white/85 px-2.5 py-1 text-[10px] font-medium uppercase tracking-wide text-gray-800 backdrop-blur ring-1 ring-black/5"
          >
            {{ ('painting.types.' + (painting.type | lowercase)) | translate }}
          </span>
        </div>

        <!-- price badge -->
        <div class="absolute right-3 top-3">
          <span class="rounded-full bg-gray-900/85 px-3 py-1 text-sm text-white backdrop-blur">
            {{ painting.price | currency:'PLN':'symbol' }}
          </span>
        </div>

        <!-- title -->
        <figcaption class="absolute inset-x-0 bottom-0 p-3">
          <h3 class="line-clamp-1 text-base font-semibold text-white drop-shadow">
            {{ painting.name }}
          </h3>
        </figcaption>
      </figure>
    </article>
  </div>

  <!-- Pagination -->
  <div class="mt-8 flex items-center justify-between">
    <button *ngIf="pageIndex!==0"
      class="inline-flex items-center gap-2 rounded-full border border-gray-300 bg-white/80 px-4 py-2
             text-sm text-gray-700 shadow-sm transition hover:bg-white hover:shadow-md
             disabled:opacity-40 disabled:hover:shadow-none"
      (click)="prevPage()"
      [disabled]="pageIndex===0"
      aria-label="Poprzednia strona">
      <span class="select-none">←</span>
      {{ 'home.back' | translate }}
    </button>

    <button
      class="inline-flex items-center gap-2 rounded-full border border-gray-300 bg-white/80 px-4 py-2
             text-sm text-gray-700 shadow-sm transition hover:bg-white hover:shadow-md
             disabled:opacity-40 disabled:hover:shadow-none"
      (click)="nextPage()"
      [disabled]="pageIndex + 1 >= totalPages"
      aria-label="Następna strona">
      {{ 'home.next' | translate }}
      <span class="select-none">→</span>
    </button>
  </div>
</div>
