<div class="additional-elements d-flex justify-content-center align-items-center">
  <a
    href="https://www.instagram.com/kamila_bialkowskaismail/"
    target="_blank"
    class="text-xl p-1 m-1 text-black hover:text-gray-600"
  >
    <i class="fab fa-instagram"></i>
  </a>
  <span class="pipe mx-2">|</span>
  <button
    type="button"
    (click)="toggleLang()"
    [attr.aria-label]="(lang.currentLang === 'pl' ? ('lang.switchTo.en' | translate) : ('lang.switchTo.pl' | translate))">
    {{ switchLabel }}
  </button>
</div>
