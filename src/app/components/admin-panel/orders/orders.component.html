<section class="min-h-screen w-full bg-white">
  <div class="grid grid-cols-[56px_1fr] md:grid-cols-[64px_1fr]">
    <aside class="sticky top-0 h-screen w-14 md:w-16 border-r border-gray-200 bg-white z-10">
      <app-sidebar></app-sidebar>
    </aside>

    <!-- Treść -->
    <main class="mx-auto max-w-8xl px-4 py-6 grid grid-cols-1 lg:grid-cols-[2fr_1fr] gap-4">
      <section class="min-w-0">
        <app-order-list (orderSelected)="onOrderSelected($event)"></app-order-list>
      </section>
      <aside class="hidden lg:block min-w-0">
        <div class="sticky top-20">
          <app-order-detail [order]="selectedOrder"></app-order-detail>
        </div>
      </aside>
    </main>
  </div>
</section>
