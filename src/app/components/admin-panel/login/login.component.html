<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <h2 class="mt-10 text-center text-2xl font-bold">Logowanie do Panelu Administratora</h2>
  </div>

  <div class="mt-4 sm:mx-auto sm:w-full sm:max-w-sm" *ngIf="banner">
    <div class="rounded bg-yellow-50 border border-yellow-300 text-yellow-900 p-3 text-sm">
      {{ banner }}
    </div>
  </div>

  <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-sm">
    <form class="space-y-6" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label for="username" class="block text-sm font-medium">Email / login</label>
        <input id="username" type="text" formControlName="username"
               class="mt-1 block w-full rounded-md border ring-1 ring-gray-300" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium">Hasło</label>
        <input id="password" type="password" formControlName="password"
               class="mt-1 block w-full rounded-md border ring-1 ring-gray-300" />
      </div>

      <div *ngIf="error" class="text-red-600 text-sm">{{ error }}</div>

      <button type="submit"
              [disabled]="loading || form.invalid"
              class="w-full rounded-md bg-indigo-600 px-3 py-1.5 text-white disabled:opacity-50">
        {{ loading ? 'Logowanie…' : 'Zaloguj się' }}
      </button>
    </form>
  </div>
</div>
