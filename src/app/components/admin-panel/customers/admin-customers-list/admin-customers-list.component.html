<!-- customers/customers-list.component.html -->
<div class="rounded-2xl bg-white/80 backdrop-blur ring-1 ring-black/5 p-6">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-slate-900">Klienci</h2>
  </div>

  <div class="mt-4 overflow-hidden rounded-xl ring-1 ring-black/5">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50 text-slate-500">
      <tr>
        <th class="py-2 pl-4 pr-2 text-left">Klient</th>
        <th class="py-2 px-2 text-left hidden sm:table-cell">Email</th>
        <th class="py-2 px-2 text-left hidden md:table-cell">Telefon</th>
        <th class="py-2 px-2 text-right">Akcje</th>
      </tr>
      </thead>
      <tbody>
      <ng-container *ngFor="let c of customers()">
        <tr class="border-t">
          <td class="py-3 pl-4 pr-2">
            <div class="font-medium text-slate-900">{{ c.firstName }} {{ c.lastName }}</div>
            <div class="text-[11px] text-slate-500">ID: {{ c.id }}</div>
          </td>
          <td class="py-3 px-2 hidden sm:table-cell">{{ c.email || '—' }}</td>
          <td class="py-3 px-2 hidden md:table-cell">{{ c.city || '—' }}</td>
          <td class="py-3 px-2 text-right">
            <button (click)="toggle(c)"
                    class="inline-flex items-center gap-1 rounded-xl px-2.5 py-1 text-xs font-medium ring-1 ring-slate-200 hover:bg-slate-50">
              <span>zamówienia</span>
              <svg [class.rotate-180]="isExpanded(c.id)"
                   class="h-4 w-4 transition-transform"
                   viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 011.08 1.04l-4.25 4.25a.75.75 0 01-1.06 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
              </svg>
            </button>
            <button (click)="goDetails(c.id)"
                    class="ml-2 inline-flex items-center gap-1 rounded-xl px-2.5 py-1 text-xs font-medium ring-1 ring-indigo-200 text-indigo-700 hover:bg-indigo-50">
              szczegóły
            </button>
          </td>
        </tr>

        <!-- Dropdown z zamówieniami -->
        <tr *ngIf="isExpanded(c.id)">
          <td colspan="4" class="bg-slate-50/60">
            <div class="p-3">
              <div class="text-sm font-semibold text-slate-700 mb-2">Zamówienia klienta</div>
              <div class="overflow-hidden rounded-xl ring-1 ring-black/5">
                <table class="min-w-full text-sm">
                  <thead class="bg-white text-slate-500">
                  <tr>
                    <th class="py-2 pl-4 pr-2 text-left">ID</th>
                    <th class="py-2 px-2 text-left hidden sm:table-cell">Status</th>
                    <th class="py-2 px-2 text-right">Kwota</th>
                    <th class="py-2 px-2 text-right hidden md:table-cell">Data</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr *ngFor="let o of (ordersByCustomer()[c.id] || [])" class="border-t bg-white">
                    <td class="py-2 pl-4 pr-2">#{{ o.id }}</td>
                    <td class="py-2 px-2 hidden sm:table-cell">
                          <span class="rounded-full px-2.5 py-1 text-[11px] font-medium ring-1"
                                [class.bg-emerald-50]="o.paymentStatus === 'COMPLETED'"
                                [class.text-emerald-700]="o.paymentStatus === 'COMPLETED'"
                                [class.ring-emerald-200]="o.paymentStatus === 'COMPLETED'"
                                [class.bg-yellow-50]="o.paymentStatus === 'NEW'"
                                [class.text-yellow-700]="o.paymentStatus === 'NEW'"
                                [class.ring-yellow-200]="o.paymentStatus === 'NEW'"
                                [class.bg-red-50]="o.paymentStatus === 'FAILED'"
                                [class.text-red-700]="o.paymentStatus === 'FAILED'"
                                [class.ring-red-200]="o.paymentStatus === 'FAILED'">
                            {{ o.paymentStatus }}
                          </span>
                    </td>
                    <td class="py-2 px-2 text-right">
                      {{ o.totalAmount | currency:'PLN' }}
                    </td>
                    <td class="py-2 px-2 text-right hidden md:table-cell">
                      {{ o.createdAt | date:'dd-MM-yyyy HH:mm:ss'}}
<!--                      {{ o.createdAt | date:'short' }}-->
                    </td>
                  </tr>
                  <tr *ngIf="!(ordersByCustomer()[c.id]?.length)">
                    <td colspan="4" class="py-3 pl-4 pr-2 text-slate-500 text-sm">Brak zamówień</td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </td>
        </tr>

      </ng-container>
      </tbody>
    </table>
  </div>
</div>
