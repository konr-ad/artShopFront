<section class="grid min-h-screen w-full grid-cols-[56px_1fr] bg-white">
  <app-sidebar></app-sidebar>

  <main class="mx-auto w-full px-4 py-6 grid gap-6 grid-cols-1">
    <app-discount-code-list
      #list
      (addCode)="openAddCodeModal()">
    </app-discount-code-list>

    <app-add-code-modal
      (discountCodeAdded)="list.load()"
      (closeModal)="onModalClosed()">
    </app-add-code-modal>
  </main>
</section>
