<div class="grid min-h-screen w-full grid-cols-[56px_1fr] bg-white">
  <app-sidebar></app-sidebar>

  <main class="mx-auto max-w-8xl px-4 py-6 grid w-full gap-4 grid-cols-1 lg:grid-cols-[2fr_1fr]">
    <!-- LISTA -->
    <section class="w-full">
      <app-admin-product-list
        (productSelected)="onProductSelected($event)"
        (addProduct)="openAddProductModal()"
        #adminList>
      </app-admin-product-list>
    </section>

    <!-- SZCZEGÓŁY -->
    <aside class="hidden lg:block">
      <div class="sticky top-20">
        <app-admin-product-details
          [product]="selectedProduct"
          (edit)="openEditProductModal($event)">
        </app-admin-product-details>
      </div>
    </aside>
  </main>

  <!-- Modal na poziomie rodzica -->
  <app-add-product-modal
    [isOpen]="isAddOpen"
    (closed)="isAddOpen = false;"
    (productAdded)="handleProductAdded($event)">
  </app-add-product-modal>
</div>
