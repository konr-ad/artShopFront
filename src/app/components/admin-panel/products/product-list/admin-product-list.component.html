<div class="w-full">
  <!-- TOOLBAR -->
  <div
    class="rounded-2xl bg-white/80 backdrop-blur ring-1 ring-black/5 p-4 shadow-[0_8px_30px_rgba(0,0,0,0.06)]">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex flex-1 items-center gap-3">
        <div class="relative w-full sm:max-w-sm">
          <input [(ngModel)]="searchTerm" type="text" placeholder="Szukaj po nazwie…"
                 class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 pr-9 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <span class="material-icons-outlined absolute right-2 top-2.5 text-slate-400 text-base">search</span>
        </div>

        <select [(ngModel)]="typeFilter"
                class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="ALL">Wszystkie typy</option>
          <option *ngFor="let t of paintingTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <button (click)="onAddClick()"
              class="inline-flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-2 text-white shadow hover:bg-slate-800">
        <span class="material-icons-outlined text-base">Dodaj nowy produkt</span>
      </button>
    </div>
  </div>

  <!-- LISTA -->
  <div class="mt-4 overflow-x-auto rounded-2xl bg-white/80 backdrop-blur ring-1 ring-black/5 shadow-[0_8px_30px_rgba(0,0,0,0.06)]">
    <table class="min-w-full text-sm">
      <thead>
      <tr class="text-left text-slate-500 border-b">
        <th class="py-3 pl-4 pr-2 cursor-pointer select-none" (click)="sortBy('id')">
          ID <span class="text-[11px]" *ngIf="sortKey==='id'">{{ sortDir==='asc'?'▲':'▼' }}</span>
        </th>
        <th class="py-3 px-2 cursor-pointer select-none" (click)="sortBy('name')">
          Nazwa <span class="text-[11px]" *ngIf="sortKey==='name'">{{ sortDir==='asc'?'▲':'▼' }}</span>
        </th>
        <th class="py-3 px-2 hidden md:table-cell">Typ</th>
        <th class="py-3 px-2 cursor-pointer select-none text-right" (click)="sortBy('price')">
          Cena <span class="text-[11px]" *ngIf="sortKey==='price'">{{ sortDir==='asc'?'▲':'▼' }}</span>
        </th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let p of filteredAndSorted(); trackBy: trackById"
          (click)="selectProduct(p)"
          class="border-t transition-colors cursor-pointer"
          [class.bg-slate-50]="selectedProductId===p.id"
          [class.hover:bg-slate-50]="selectedProductId!==p.id">
        <td class="py-3 pl-4 pr-2 font-medium text-slate-900">#{{ p.id }}</td>
        <td class="py-3 px-2">
          <div class="flex items-center gap-3">
            <img *ngIf="p.imageUrl" [src]="p.imageUrl" alt="" class="h-10 w-10 rounded-md object-cover ring-1 ring-black/5" />
            <div>
              <div class="font-medium text-slate-900">{{ p.name }}</div>
              <div class="text-[11px] text-slate-500 line-clamp-1">{{ p.description }}</div>
            </div>
          </div>
        </td>
        <td class="py-3 px-2 hidden md:table-cell">
          <span class="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-medium text-slate-700 ring-1 ring-slate-200">
            {{ p.type }}
          </span>
        </td>
        <td class="py-3 px-4 text-right font-semibold text-slate-900">
          {{ p.price | currency:'PLN':'symbol':'1.0-2' }}
        </td>
      </tr>

      <!-- Empty state -->
      <tr *ngIf="filteredAndSorted().length === 0">
        <td colspan="4" class="py-12 text-center text-slate-500">
          Brak wyników. Zmień kryteria wyszukiwania lub
          <button class="underline text-indigo-600 hover:text-indigo-700" (click)="onAddClick()">dodaj pierwszy produkt</button>.
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
