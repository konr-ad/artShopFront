<!-- Gdy jest produkt -->
<div *ngIf="product; else empty"
     class="rounded-2xl bg-white/80 backdrop-blur ring-1 ring-black/5 p-6 shadow-[0_8px_30px_rgba(0,0,0,0.06)]">

  <!-- Header (grid 2 kolumny) -->
  <div class="grid grid-cols-[1fr_auto] items-start gap-3">
    <div>
      <h2 class="text-xl font-bold text-slate-900">{{ product.name }}</h2>

      <!-- chipy: status/typ/id (grid zamiast flex) -->
      <div class="mt-2 grid gap-2 grid-cols-2 sm:grid-cols-3 items-start">
        <span class="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-medium text-slate-700 ring-1 ring-slate-200">
          {{ product.type || '—' }}
        </span>
        <span *ngIf="product.state"
              class="rounded-full bg-emerald-50 px-2.5 py-1 text-[11px] font-medium text-emerald-700 ring-1 ring-emerald-200">
          {{ product.state }}
        </span>
        <span class="text-xs text-slate-500 self-center">#{{ product.id }}</span>
      </div>
    </div>

    <!-- przyciski (inline-grid) -->
    <div class="grid auto-cols-max grid-flow-col gap-2 justify-end">
      <button
        class="inline-grid place-items-center rounded-xl bg-white px-3 py-2 text-sm text-slate-700
               ring-1 ring-slate-200 hover:bg-slate-50"
        (click)="goToPublic(product?.id)"
        [disabled]="!product?.id">
        Podgląd
      </button>
      <!--
      <button
        class="inline-grid place-items-center rounded-xl bg-slate-900 px-3 py-2 text-sm text-white hover:bg-slate-800"
        (click)="edit.emit(product?.id)"
        [disabled]="!product?.id">
        <span class="material-icons-outlined mr-1 text-base">edit</span>
        Edytuj
      </button>
      -->
    </div>
  </div>

  <!-- Image -->
  <div class="mt-4 overflow-hidden rounded-xl ring-1 ring-black/5">
    <img [src]="imageSrc" [alt]="product?.name" class="w-full aspect-[4/3] object-cover" />
  </div>

  <!-- Meta (pary label/wartość w grid) -->
  <dl class="mt-5 grid grid-cols-2 gap-y-3 text-sm">
    <dt class="text-slate-500">Opis</dt>
    <dd class="text-right text-slate-900 max-w-[65%] justify-self-end">
      {{ product.description || '—' }}
    </dd>

    <dt class="text-slate-500">Cena</dt>
    <dd class="font-semibold text-slate-900 text-right">
      {{ product.price | currency:'PLN':'symbol':'1.0-2' }}
    </dd>
  </dl>
</div>

<!-- Pusty stan -->
<ng-template #empty>
  <div class="rounded-2xl bg-white/70 backdrop-blur ring-1 ring-black/5 p-10 text-center text-slate-600 shadow-[0_8px_30px_rgba(0,0,0,0.06)]">
    <h3 class="text-lg font-semibold text-slate-900">Brak wybranego produktu</h3>
    <p class="mt-1 text-sm">Zaznacz pozycję z listy po lewej, aby zobaczyć szczegóły.</p>
  </div>
</ng-template>
