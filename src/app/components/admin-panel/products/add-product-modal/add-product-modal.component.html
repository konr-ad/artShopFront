<div *ngIf="isOpen" class="fixed inset-0 z-50">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="close()"></div>

  <!-- Dialog -->
  <div class="relative mx-auto mt-10 w-full max-w-2xl rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-black/5
              animate-[fadeIn_200ms_ease-out]">
    <!-- Header -->
    <div class="flex items-start justify-between">
      <h2 class="text-xl font-bold text-slate-900">Dodaj nowy produkt</h2>
      <button (click)="close()" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100">
        <span class="material-icons">close</span>
      </button>
    </div>

    <form class="mt-4 space-y-4" [formGroup]="productForm" (ngSubmit)="onSubmit()">

      <!-- Nazwa + Typ -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Nazwa *</label>
          <input type="text" formControlName="name"
                 class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="mt-1 text-xs text-rose-600" *ngIf="productForm.get('name')?.touched && productForm.get('name')?.invalid">
            Wpisz nazwę.
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Typ *</label>
          <select formControlName="type"
                  class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="" disabled hidden>Wybierz typ</option>
            <option *ngFor="let t of types" [value]="t">{{ t }}</option>
          </select>
          <p class="mt-1 text-xs text-rose-600" *ngIf="productForm.get('type')?.touched && productForm.get('type')?.invalid">
            Wybierz typ.
          </p>
        </div>
      </div>

      <!-- Cena -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-slate-700">Cena *</label>
          <input type="number" formControlName="price" step="0.01" min="0.01"
                 class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="mt-1 text-xs text-rose-600" *ngIf="productForm.get('price')?.touched && productForm.get('price')?.invalid">
            Podaj cenę &gt; 0.
          </p>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-700">Status</label>
          <select formControlName="state"
                  class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="AVAILABLE">AVAILABLE</option>
            <option value="SOLD">SOLD</option>
          </select>
        </div>
      </div>

      <!-- Opisy -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Opis (PL)</label>
          <textarea formControlName="descriptionPl"
                    class="mt-1 min-h-24 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Opis (EN)</label>
          <textarea formControlName="descriptionEn"
                    class="mt-1 min-h-24 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
      </div>

      <!-- Uploader: drag&drop + inputy -->
      <div class="rounded-xl border border-dashed border-slate-300 p-4">
        <p class="text-sm font-medium text-slate-700 mb-2">Zdjęcia</p>

        <div
          class="relative grid place-items-center rounded-lg bg-slate-50 p-6 text-center ring-1 ring-inset ring-slate-200
                 hover:bg-slate-100 transition"
          (dragover)="onDragOver($event)"
          (drop)="onDrop($event)">
          <div>
            <p class="text-sm text-slate-600">Przeciągnij i upuść pliki tutaj</p>
            <p class="text-xs text-slate-500">lub</p>
            <div class="mt-2 flex flex-wrap items-center justify-center gap-2">
              <label class="cursor-pointer inline-flex items-center rounded-xl bg-white px-3 py-2 text-sm text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50">
                <input type="file" accept="image/*" class="hidden" (change)="onPrimaryImageChange($event)" />
                Zdjęcie główne
              </label>
              <label class="cursor-pointer inline-flex items-center rounded-xl bg-white px-3 py-2 text-sm text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50">
                <input type="file" multiple accept="image/*" class="hidden" (change)="onAdditionalImagesChange($event)" />
                Dodatkowe zdjęcia
              </label>
            </div>
          </div>
        </div>

        <!-- Podglądy + wybór głównego -->
        <div *ngIf="allPreviews.length" class="mt-4">
          <p class="text-sm text-slate-700 mb-2">Wybierz zdjęcie główne:</p>

          <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            <button
              type="button"
              *ngFor="let src of allPreviews; let i = index"
              (click)="selectedPrimaryIndex = i"
              class="group relative overflow-hidden rounded-lg ring-1 ring-black/5">
              <img [src]="src" class="h-32 w-full object-cover" />
              <div class="absolute inset-0"
                   [class.ring-2]="selectedPrimaryIndex===i"
                   [class.ring-indigo-500]="selectedPrimaryIndex===i"></div>
              <div class="absolute right-2 top-2 rounded-full bg-white/90 p-1 ring-1 ring-black/5">
                <span class="material-icons-outlined text-sm"
                      [class.text-indigo-600]="selectedPrimaryIndex===i">star</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="errorMsg" class="text-sm text-rose-600">{{ errorMsg }}</div>

      <!-- Actions -->
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" (click)="close()"
                class="rounded-xl bg-white px-4 py-2 text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50"
                [disabled]="busy">
          Anuluj
        </button>
        <button type="submit"
                class="rounded-xl bg-slate-900 px-4 py-2 text-white hover:bg-slate-800 disabled:opacity-50"
                [disabled]="busy || productForm.invalid || allFiles.length === 0">
          {{ busy ? 'Zapisywanie…' : 'Dodaj' }}
        </button>
      </div>
    </form>
  </div>
</div>
