<!-- Modal -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 bg-black/50 flex items-start justify-center overflow-y-auto p-4 sm:p-6 md:p-8"
  role="dialog" aria-modal="true"
  (keydown.escape)="close()"
  tabindex="0"
>
  <!-- Kontener -->
  <div class="relative w-full max-w-3xl bg-white rounded-2xl shadow-xl grid grid-rows-[auto,1fr,auto] max-h-[85vh]">

    <!-- Header -->
    <div class="flex items-start justify-between gap-4 p-4 sm:p-6 border-b">
      <h2 class="text-lg sm:text-xl font-bold">Dodaj Nowy Produkt</h2>
      <button type="button"
              (click)="close()"
              class="shrink-0 rounded-xl p-2 ring-1 ring-slate-200 hover:bg-slate-50 focus:outline-none">
        ✕
      </button>
    </div>

    <!-- Scrollowalna treść -->
    <div class="overflow-y-auto p-4 sm:p-6">
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()" id="addProductForm" class="grid gap-6">

        <!-- Nazwa + Typ -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">Nazwa *</label>
            <input type="text" formControlName="name"
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            <p class="mt-1 text-xs text-rose-600" *ngIf="productForm.get('name')?.touched && productForm.get('name')?.invalid">
              Wpisz nazwę.
            </p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700">Typ *</label>
            <select formControlName="type"
                    class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="" disabled hidden>Wybierz typ</option>
              <option *ngFor="let t of types" [value]="t">{{ typeLabels[t] }}</option>
            </select>
            <p class="mt-1 text-xs text-rose-600" *ngIf="productForm.get('type')?.touched && productForm.get('type')?.invalid">
              Wybierz typ.
            </p>
          </div>
        </div>

        <!-- Cena + Status -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">Cena *</label>
            <input type="number" formControlName="price" step="0.01" min="0.01"
                   class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            <p class="mt-1 text-xs text-rose-600" *ngIf="productForm.get('price')?.touched && productForm.get('price')?.invalid">
              Podaj cenę &gt; 0.
            </p>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700">Status</label>
            <select formControlName="state"
                    class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="AVAILABLE">Dostępny</option>
              <option value="SOLD">Zablokowany</option>
            </select>
          </div>
        </div>

        <!-- Opisy -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">Opis (PL)</label>
            <textarea formControlName="descriptionPl"
                      class="mt-1 min-h-24 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Opis (EN)</label>
            <textarea formControlName="descriptionEn"
                      class="mt-1 min-h-24 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>
        </div>

        <!-- Uploader -->
        <div class="rounded-xl border border-dashed border-slate-300 p-4">
          <p class="text-sm font-medium text-slate-700 mb-2">Zdjęcia</p>

          <div
            class="relative grid place-items-center rounded-lg bg-slate-50 p-6 text-center ring-1 ring-inset ring-slate-200 hover:bg-slate-100 transition"
            (dragover)="onDragOver($event)" (drop)="onDrop($event)">
            <div>
              <p class="text-sm text-slate-600">Przeciągnij i upuść pliki tutaj</p>
              <p class="text-xs text-slate-500">lub</p>
              <div class="mt-2 grid items-center justify-center">
                <label class="cursor-pointer inline-flex items-center rounded-xl bg-white px-3 py-2 text-sm text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50">
                  <input type="file" multiple accept="image/*" class="hidden" (change)="onAdditionalImagesChange($event)"/>
                  Dodaj zdjęcia
                </label>
              </div>
            </div>
          </div>

          <!-- Scrollowalne miniatury -->
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3 max-h-128 overflow-y-auto pr-1">
            <div *ngFor="let src of allPreviews; let i = index"
                 class="relative border rounded-md overflow-hidden group">

              <!-- Miniatura -->
              <img [src]="src" class="w-full h-32 object-cover" />

              <!-- Przycisk usuń -->
              <button type="button"
                      (click)="removeImage(i, $event)"
                      class="absolute top-1 right-1 bg-red-600 text-white text-xs rounded-full w-6 h-6 flex items-center justify-center opacity-100">
                ✕
              </button>

              <!-- Wybór głównego -->
              <div class="flex items-center gap-2 p-2 cursor-pointer hover:bg-slate-50"
                   (click)="onPrimaryPicked(i)">
                <input type="radio" name="primaryIdx"
                       [value]="i"
                       [checked]="selectedPrimaryIndex === i"
                       class="cursor-pointer" />
                <span class="text-sm">{{ i === 0 ? 'Zdjęcie' : 'Zdjęcie' + i }}</span>
              </div>
            </div>
          </div>


          <div *ngIf="errorMsg" class="mt-3 text-red-600 text-sm">{{ errorMsg }}</div>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-2 p-4 sm:p-6 border-t">
      <button type="button" (click)="close()"
              class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded"
              [disabled]="busy">
        Anuluj
      </button>
      <button
        type="submit"
        form="addProductForm"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50"
        [disabled]="busy || productForm.invalid || (mode==='create' && allFiles.length === 0)">
        Dodaj
      </button>
    </div>
  </div>
</div>
