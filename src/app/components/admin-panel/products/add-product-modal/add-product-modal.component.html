<div *ngIf="isOpen" class="fixed inset-0 bg-black/50 flex justify-center items-center z-50">
  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-xl">
    <h2 class="text-xl font-bold mb-4">Dodaj Nowy Produkt</h2>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <!-- Nazwa -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Nazwa *</label>
        <input type="text" formControlName="name" class="mt-1 block w-full border rounded-md p-2"/>
      </div>

      <!-- Opisy: PL / EN -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Opis (PL)</label>
          <textarea formControlName="descriptionPl" class="mt-1 block w-full border rounded-md p-2"></textarea>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Opis (EN)</label>
          <textarea formControlName="descriptionEn" class="mt-1 block w-full border rounded-md p-2"></textarea>
        </div>
      </div>

      <!-- Typ -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Typ *</label>
        <select formControlName="type" class="mt-1 block w-full border rounded-md p-2">
          <option value="" disabled hidden>Wybierz typ</option>
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>

      <!-- Cena -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Cena *</label>
        <input type="number" formControlName="price" step="0.01" min="0.01" class="mt-1 block w-full border rounded-md p-2"/>
      </div>

      <!-- (opcjonalnie) Stan -->
      <!--
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Stan</label>
        <select formControlName="state" class="mt-1 block w-full border rounded-md p-2">
          <option value="AVAILABLE">AVAILABLE</option>
          <option value="SOLD">SOLD</option>
        </select>
      </div>
      -->

      <!-- Plik główny -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Zdjęcie główne *</label>
        <input type="file" accept="image/png, image/jpeg" (change)="onPrimaryImageChange($event)" class="mt-1 block w-full"/>
      </div>

      <!-- Dodatkowe -->
      <div class="mb-2">
        <label class="block text-sm font-medium text-gray-700">Dodatkowe zdjęcia</label>
        <input type="file" multiple accept="image/png, image/jpeg" (change)="onAdditionalImagesChange($event)" class="mt-1 block w-full"/>
      </div>

      <!-- Podglądy + wybór zdjęcia głównego -->
      <div *ngIf="allPreviews.length" class="mb-4">
        <p class="text-sm text-gray-700 mb-2">Wybierz zdjęcie główne:</p>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
          <label *ngFor="let src of allPreviews; let i = index"
                 class="block border rounded-md overflow-hidden cursor-pointer hover:ring-2 hover:ring-indigo-400">
            <img [src]="src" class="w-full h-32 object-cover"/>
            <div class="flex items-center gap-2 p-2">
              <input type="radio" name="primary" [checked]="selectedPrimaryIndex === i" (change)="selectedPrimaryIndex = i"/>
              <span class="text-sm">{{ i === 0 ? 'Główne (pobrane z pola 1)' : 'Dodatkowe ' + i }}</span>
            </div>
          </label>
        </div>
      </div>

      <div *ngIf="errorMsg" class="mb-3 text-red-600 text-sm">{{ errorMsg }}</div>

      <div class="flex justify-end gap-2">
        <button type="button" (click)="close()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded" [disabled]="busy">
          Anuluj
        </button>
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50" [disabled]="busy || productForm.invalid || allFiles.length === 0">
          {{ busy ? 'Zapisywanie…' : 'Dodaj' }}
        </button>
      </div>
    </form>
  </div>
</div>
