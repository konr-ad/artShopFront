<main class="grid min-h-full place-items-center bg-white px-6 py-24 sm:py-32 lg:px-8" role="main"
      aria-labelledby="nf-title">
  <div class="text-center">
    <p class="text-base font-semibold text-indigo-600">
      {{ 'notFound.code' | translate }}
    </p>

    <h1 id="nf-title" class="mt-4 text-3xl font-bold tracking-tight text-gray-900 sm:text-5xl">
      {{ 'notFound.title' | translate }}
    </h1>

    <p class="mt-6 text-base leading-7 text-gray-600">
      {{ 'notFound.message' | translate }}
    </p>

    <div class="mt-10 flex items-center justify-center gap-x-6">
      <a
        routerLink="/home"
        class="rounded-md border border-transparent bg-gray-600 px-8 py-3 text-base font-medium text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-50"
        [attr.aria-label]="'notFound.backHome' | translate"
      >
        {{ 'notFound.backHome' | translate }}
      </a>
    </div>
  </div>
</main>
